name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install Project Dependencies
        run: npm ci

      - name: Run test suites
        run: npm test

      - name: Upgrade npm & Publish via OIDC
        # We upgrade the npm engine right here so Trusted Publishing has its OIDC handler
        run: |
          npm install -g npm@latest
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}