name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org # Required for setup-node authentication tracking

      - name: Clear legacy project npmrc
        # This deletes the repository's local .npmrc file so it doesn't conflict with npm 11
        run: rm -f .npmrc 

      - run: npm install --no-userconfig --legacy-peer-deps
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
